<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="50%" stop-color="#eff4fa"/>
      <stop offset="100%" stop-color="#d6e3f3"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b5998"/>
      <stop offset="50%" stop-color="#567bb8"/>
      <stop offset="100%" stop-color="#3b5998"/>
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf3d8"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="16" fill="url(#mGrad12)"/>
  <circle cx="120" cy="110" r="50" fill="#fdfcf8" filter="drop-shadow(0 4px 12px rgba(59,89,152,0.15))"/>
  <!-- Two-Tier Royal Cake -->
  <g transform="translate(120, 115) scale(0.9)">
    <!-- Plate -->
    <ellipse cx="0" cy="30" rx="36" ry="7" fill="#dfbd78"/>
    <!-- Bottom Tier -->
    <rect x="-26" y="8" width="52" height="20" rx="4" fill="url(#cakeGrad)"/>
    <!-- Bottom Frosting Drips -->
    <path d="M-26 8 Q-22 14 -18 8 Q-14 14 -10 8 Q-6 14 -2 8 Q2 14 6 8 Q10 14 14 8 Q18 14 22 8 Q26 14 26 8" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <!-- Top Tier -->
    <rect x="-18" y="-10" width="36" height="18" rx="3" fill="#ffffff" stroke="#dfbd78" stroke-width="1.2"/>
    <!-- Golden 1 Candle -->
    <rect x="-2" y="-24" width="4" height="14" rx="2" fill="#dfbd78"/>
    <text x="0" y="-12" font-family="'Cinzel', serif" font-size="10" font-weight="700" fill="#dfbd78" text-anchor="middle">1</text>
    <!-- Flame -->
    <path d="M0 -25 C-3 -29 0 -36 0 -36 C0 -36 3 -29 0 -25 Z" fill="#ffb703"/>
    <circle cx="0" cy="-28" r="1.5" fill="#fff"/>
  </g>
  <text x="120" y="180" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#2c4869" text-anchor="middle">1 Year Old</text>
  <text x="120" y="198" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#b68f44" text-anchor="middle" letter-spacing="1">TURNING ONE TODAY!</text>
</svg>
